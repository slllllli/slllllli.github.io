# ============================================================
# The Paper Room — Hexo configuration
# Docs: https://hexo.io/docs/configuration.html
# ============================================================

# Site
title: The Paper Room
title_zh: 论文解构室
subtitle: Close readings of the papers behind modern AI
subtitle_zh: 拆解现代 AI 背后的关键论文
description: >-
  A bilingual notebook of close readings of foundational machine-learning
  papers — the question, the mechanism, the evidence, and the limits.
description_zh: >-
  一份中英双语论文精读笔记：拆解机器学习关键论文中的问题、机制、证据与局限。
keywords:
  - machine learning
  - paper reading
  - deep learning
  - transformer
  - AI research
  - 论文精读
author: slllllli
language: en
timezone: Asia/Shanghai

# URL
url: https://slllllli.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Archive pages are generated per language by scripts/bilingual.js
archive_generator:
  per_page: 0
  yearly: false
  monthly: false
  daily: false

# Category & Tag
default_category: Notes
category_map:
tag_map:

# Markdown
marked:
  gfm: true
  breaks: false
  smartypants: false
  headerIds: true
  lazyload: true
  prependRoot: true
  external_link:
    enable: true
    exclude: []
    nofollow: false

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: paper

# Deployment
# GitHub Pages deployment is handled by .github/workflows/pages.yml
deploy:
  type: ''
